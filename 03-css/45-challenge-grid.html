<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-Challenge Grind</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        .gallery {
            display: grid;
            width: 100%;
            max-width: 600px;
            margin: 0 auto 20px;
            box-sizing: border-box;
        }

        .gallery div {
            margin: 5px;
            background: #8aa4e8;
            border-radius: 8px;
            overflow: hidden;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .a { grid-area: a; }
        .b { grid-area: b; }
        .c { grid-area: c; }
        .d { grid-area: d; }
        .e { grid-area: e; }
        .f { grid-area: f; }
        .g { grid-area: g; }

        .gallery-1 {
            aspect-ratio: 3 / 3;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            grid-template-areas:
                "a b c"
                "d b e"
                "f f g";
        }

        .gallery-2 {
            aspect-ratio: 4 / 3;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            grid-template-areas:
                "a a b c"
                "a a d d"
                "e f d d";
        }
    </style>
</head>
